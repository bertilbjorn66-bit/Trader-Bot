name: "🧠 13 — DEEP CONTEXT INTELLIGENCE ATLAS — REUSE VERIFIED HOLDOUT"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/13-CONTEXT-INTELLIGENCE-ATLAS.yml"
      - "research/context_atlas.py"
      - "tests/test_context_atlas.py"
      - "docs/STAGE_13_CONTEXT_INTELLIGENCE_ATLAS.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/13-CONTEXT-INTELLIGENCE-ATLAS.yml"
      - "research/context_atlas.py"
      - "tests/test_context_atlas.py"
      - "docs/STAGE_13_CONTEXT_INTELLIGENCE_ATLAS.md"

permissions:
  contents: read
  actions: read

jobs:
  validate_and_build:
    name: "1️⃣ BUILD IMMUTABLE CONTEXT ATLAS — NO REDOWNLOAD"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Static checks
        run: |
          ruff check research trader_bot tests
          mypy research trader_bot

      - name: Full test suite
        run: pytest

      - name: Create immutable input workspace
        run: mkdir -p .research_input artifacts

      - name: Restore verified final holdout
        uses: actions/download-artifact@v8
        with:
          name: VERIFIED-FINAL-HOLDOUT-RESEARCH
          path: .research_input
          github-token: ${{ github.token }}
          run-id: 32658698680

      - name: Verify holdout input before analysis
        run: |
          test -s .research_input/enriched_stride60_holdout_ready.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          p = Path('.research_input/enriched_stride60_holdout_ready.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['status'] == 'ENRICHED_CONDITIONAL_EXPERIMENT_COMPLETED'
          assert data['methodology']['split'].startswith('chronological 60/40')
          assert data['methodology']['holdout_min_samples'] == 100
          assert isinstance(data['target_records'], list) and data['target_records']
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          Path('artifacts/input_sha256.txt').write_text(digest + '\n', encoding='utf-8')
          print('IMMUTABLE_HOLDOUT_INPUT_VERIFIED=true')
          print('HOLDOUT_SHA256=', digest)
          print('TARGET_RECORDS=', len(data['target_records']))
          PY

      - name: Build context atlas
        run: |
          python -m research.context_atlas \
            --input .research_input/enriched_stride60_holdout_ready.json \
            --output artifacts/context_atlas.json

      - name: Cross-check atlas invariants and input immutability
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          source = Path('.research_input/enriched_stride60_holdout_ready.json')
          atlas = json.loads(Path('artifacts/context_atlas.json').read_text(encoding='utf-8'))
          digest_before = Path('artifacts/input_sha256.txt').read_text(encoding='utf-8').strip()
          digest_after = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest_before == digest_after
          assert atlas['status'] == 'CONTEXT_ATLAS_COMPLETED'
          assert atlas['source'] == 'VERIFIED-FINAL-HOLDOUT-RESEARCH'
          assert atlas['record_count'] > 0
          assert len(atlas['coverage']['pairs']) >= 1
          assert atlas['atlas_fingerprint']
          assert atlas['methodology']['live_authorization'] == 'never granted by this analysis'
          assert all(cell['split'] in {'discovery', 'confirmation'} for cell in atlas['cells'])
          print('CONTEXT_ATLAS_COMPLETED=true')
          print('CONTEXT_ATLAS_RECORDS=', atlas['record_count'])
          print('CONTEXT_ATLAS_CELLS=', len(atlas['cells']))
          print('INPUT_IMMUTABLE=true')
          print('LIVE_AUTHORIZATION=false')
          PY

      - name: Upload context atlas
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-CONTEXT-INTELLIGENCE-ATLAS
          path: |
            artifacts/context_atlas.json
            artifacts/input_sha256.txt
          if-no-files-found: error
          retention-days: 30
