name: "📡 07 — LIVE PAPER OBSERVATION GATE — NO LIVE ORDERS"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-paper-observation:
    name: "1️⃣ VALIDATE guarded live-observation paper runner"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Ruff
        run: ruff check trader_bot tests

      - name: Mypy
        run: mypy trader_bot

      - name: Full test suite
        run: pytest -ra

      - name: Verify live execution remains disabled
        run: |
          python - <<'PY'
          from trader_bot.execution import ExecutionGateway, ExecutionStatus
          assert ExecutionGateway.status is ExecutionStatus.DISABLED
          try:
              ExecutionGateway().submit(None)  # type: ignore[arg-type]
          except Exception as exc:
              assert exc.__class__.__name__ == "ExecutionDisabled"
          else:
              raise AssertionError("live execution unexpectedly accepted a submission")
          PY

      - name: Verify paper observation runner uses current quotes only
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("trader_bot/paper_observation.py").read_text(encoding="utf-8")
          assert "current_quotes" in source
          assert "historical_bars" not in source
          PY
