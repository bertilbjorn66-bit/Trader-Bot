name: "28 — CURRENCY STRENGTH CONFIRMATION — NON-LIVE"

on:
  workflow_run:
    workflows: ["27 — CURRENCY STRENGTH DISCOVERY — NON-LIVE"]
    branches: [currency-strength-v1]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  DISCOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
  DISCOVERY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  validate-and-confirm:
    if: github.event.workflow_run.conclusion == 'success'
    name: "Validate and confirm frozen currency-strength candidate"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact discovery revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DISCOVERY_HEAD_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check research/currency_strength_confirmation.py tests/test_currency_strength_confirmation.py
          mypy research/currency_strength_confirmation.py
      - name: Boundary tests
        run: pytest -q tests/test_currency_strength_confirmation.py
      - name: Assert non-live boundary
        run: |
          set -euo pipefail
          ! grep -q 'ExecutionGateway' research/currency_strength_confirmation.py
          ! grep -q 'broker' research/currency_strength_confirmation.py
          ! grep -q 'live_execution_enabled' research/currency_strength_confirmation.py
          echo "CURRENCY_STRENGTH_CONFIRMATION_NON_LIVE=true"
      - name: Create input workspaces
        run: mkdir -p .data/empirical_feed artifacts/discovery artifacts/confirmation /tmp/repaired
      - name: Download immutable discovery evidence
        uses: actions/download-artifact@v8
        with:
          name: CURRENCY-STRENGTH-DISCOVERY-RESULT
          repository: ${{ github.repository }}
          run-id: ${{ env.DISCOVERY_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/discovery
      - name: Verify immutable discovery binding
        run: |
          set -euo pipefail
          test -s artifacts/discovery/currency_strength_discovery_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from os import environ

          report = json.loads(Path("artifacts/discovery/currency_strength_discovery_report.json").read_text(encoding="utf-8"))
          assert report["status"] == "CURRENCY_STRENGTH_DISCOVERY_COMPLETED"
          assert report["contract_version"] == "v4-currency-strength-familywise-next-open-signal-horizon-leave-one-pair-out"
          assert report["candidate_count"] >= 1
          assert report["selection_policy"]["confirmation_used_for_selection"] is False
          assert report["live_execution_authorized"] is False
          assert report["promotion_authorized"] is False
          binding = report.get("orchestration_binding")
          assert isinstance(binding, dict)
          assert binding["discovery_head_sha"] == environ["DISCOVERY_HEAD_SHA"]
          assert int(binding["discovery_run_id"]) == int(environ["DISCOVERY_RUN_ID"])
          assert len(report["top_candidates"]) >= 1
          print("DISCOVERY_BINDING_OK=true")
          print("FROZEN_CANDIDATE_RANK=1")
          PY
      - name: Read discovery source-run binding
        id: binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from os import environ
          report = json.loads(Path("artifacts/discovery/currency_strength_discovery_report.json").read_text(encoding="utf-8"))
          binding = report["orchestration_binding"]
          with open(environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"source_run_id={int(binding['source_run_id'])}", file=output)
          PY
      - name: Download six-pair verified bundle
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-reused-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .data/empirical_feed
      - name: Download repaired EUR/USD
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-eurusd
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/eurusd
      - name: Download repaired GBP/USD
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-gbpusd
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/gbpusd
      - name: Download repaired USD/JPY
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-usdjpy
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/usdjpy
      - name: Assemble exact nine-pair input
        run: |
          set -euo pipefail
          for slug in eurusd gbpusd usdjpy; do
            test -s "/tmp/repaired/$slug/$slug.jsonl"
            cp "/tmp/repaired/$slug/$slug.jsonl" ".data/empirical_feed/$slug.jsonl"
          done
          for slug in audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy; do
            test -s ".data/empirical_feed/$slug.jsonl" || { echo "Missing $slug.jsonl"; exit 1; }
          done
          echo "ALL_NINE_VERIFIED_PAIR_DATASETS=true"
      - name: Run untouched frozen-candidate confirmation
        run: |
          python -m research.currency_strength_confirmation             --input-dir .data/empirical_feed             --discovery-report artifacts/discovery/currency_strength_discovery_report.json             --output artifacts/confirmation/currency_strength_confirmation_report.json
      - name: Verify confirmation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/confirmation/currency_strength_confirmation_report.json").read_text(encoding="utf-8"))
          assert result["status"] == "CURRENCY_STRENGTH_CONFIRMATION_COMPLETED"
          assert result["candidate"]["rank"] == 1
          assert result["candidate_selection_rule"].startswith("rank-1 familywise discovery candidate was frozen before confirmation")
          assert result["promotion_authorized"] is False
          assert result["live_execution_authorized"] is False
          assert result["confirmation"]["state"] in {"PASS", "FAIL", "INCOMPLETE"}
          print("CURRENCY_STRENGTH_CONFIRMATION_VERIFIED=true")
          print("STATE=", result["confirmation"]["state"])
          print("CONFIRMATION_N=", result["confirmation"]["n"])
          print("CONFIRMATION_EXPECTANCY_PIPS=", result["confirmation"]["expectancy_pips"])
          print("CONFIRMATION_PROFIT_FACTOR=", result["confirmation"]["profit_factor"])
          print("PROMOTION_AUTHORIZED=false")
          print("LIVE_EXECUTION_AUTHORIZED=false")
          PY
      - name: Upload confirmation evidence
        uses: actions/upload-artifact@v7
        with:
          name: CURRENCY-STRENGTH-CONFIRMATION-RESULT
          path: artifacts/confirmation/currency_strength_confirmation_report.json
          if-no-files-found: error
          retention-days: 30
