name: "25 — BIDIRECTIONAL ANALOGUE CONFIRMATION — NON-LIVE"

on:
  workflow_run:
    workflows: ["24 — BIDIRECTIONAL ANALOGUE DISCOVERY — NON-LIVE"]
    types: [completed]
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: "Completed bidirectional discovery run"
        required: true
      discovery_head_sha:
        description: "Exact commit SHA used by the discovery run"
        required: true

permissions:
  contents: read
  actions: read

env:
  DISCOVERY_RUN_ID: ${{ github.event.workflow_run.id || inputs.discovery_run_id }}
  DISCOVERY_HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.discovery_head_sha || github.sha }}

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: "Validate bidirectional confirmation engine"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact discovery source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DISCOVERY_HEAD_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check research/bidirectional_analogue_discovery.py research/bidirectional_analogue_confirmation.py tests/test_bidirectional_analogue_discovery.py tests/test_bidirectional_analogue_confirmation.py
          mypy research/bidirectional_analogue_discovery.py research/bidirectional_analogue_confirmation.py
      - name: Bidirectional boundary tests
        run: pytest -q tests/test_bidirectional_analogue_discovery.py tests/test_bidirectional_analogue_confirmation.py
      - name: Assert confirmation is non-live and never promotes
        run: |
          set -euo pipefail
          ! grep -q 'ExecutionGateway' research/bidirectional_analogue_confirmation.py
          ! grep -q 'broker' research/bidirectional_analogue_confirmation.py
          ! grep -q 'live_execution_enabled' research/bidirectional_analogue_confirmation.py
          echo "BIDIRECTIONAL_CONFIRMATION_NON_LIVE=true"

  confirm:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: "Confirm frozen rank-1 bidirectional candidate"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact discovery source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DISCOVERY_HEAD_SHA }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Create input directory
        run: mkdir -p .data/empirical_feed artifacts/discovery artifacts/confirmation
      - name: Download immutable bidirectional discovery evidence
        uses: actions/download-artifact@v8
        with:
          name: BIDIRECTIONAL-ANALOGUE-DISCOVERY-RESULT
          repository: ${{ github.repository }}
          run-id: ${{ env.DISCOVERY_RUN_ID }}
          github-token: ${{ github.token }}
          path: artifacts/discovery
      - name: Read and validate discovery binding
        id: binding
        run: |
          set -euo pipefail
          test -s artifacts/discovery/bidirectional_discovery_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from os import environ

          report = json.loads(Path("artifacts/discovery/bidirectional_discovery_report.json").read_text(encoding="utf-8"))
          if report.get("status") != "BIDIRECTIONAL_ANALOGUE_DISCOVERY_COMPLETED":
              raise SystemExit("discovery evidence is not complete")
          policy = report.get("selection_policy", {})
          if policy.get("contract_version") != "v1-bidirectional-analogue-familywise":
              raise SystemExit("unsupported bidirectional discovery contract")
          if policy.get("confirmation_used_for_selection") is not False:
              raise SystemExit("discovery selection was not proven confirmation-free")
          binding = report.get("orchestration_binding")
          if not isinstance(binding, dict):
              raise SystemExit("discovery evidence has no immutable orchestration binding")
          if int(binding["discovery_run_id"]) != int(environ["DISCOVERY_RUN_ID"]):
              raise SystemExit("discovery run ID does not match requested workflow run")
          if str(binding["discovery_head_sha"]) != environ["DISCOVERY_HEAD_SHA"]:
              raise SystemExit("discovery head SHA does not match requested revision")
          if "source_run_id" not in binding or "sample_stride" not in binding or "history_states" not in binding:
              raise SystemExit("discovery binding is incomplete")
          if not report.get("candidate_count", 0):
              raise SystemExit("no discovery candidate exists to confirm")
          with open(environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"source_run_id={int(binding['source_run_id'])}", file=output)
              print(f"sample_stride={int(binding['sample_stride'])}", file=output)
              print(f"history_states={int(binding['history_states'])}", file=output)
          PY
      - name: Download the exact nine source feeds
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-reused-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: .data/empirical_feed
      - name: Download repaired EUR/USD feed
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-eurusd
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/eurusd
      - name: Download repaired GBP/USD feed
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-gbpusd
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/gbpusd
      - name: Download repaired USD/JPY feed
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-usdjpy
          repository: ${{ github.repository }}
          run-id: ${{ steps.binding.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/usdjpy
      - name: Place repaired files and verify all nine feeds
        run: |
          set -euo pipefail
          for slug in eurusd gbpusd usdjpy; do
            test -s "/tmp/repaired/$slug/$slug.jsonl"
            cp "/tmp/repaired/$slug/$slug.jsonl" ".data/empirical_feed/$slug.jsonl"
          done
          for slug in audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy; do
            test -s ".data/empirical_feed/$slug.jsonl" || { echo "Missing $slug.jsonl"; exit 1; }
          done
          echo "ALL_NINE_CONFIRMATION_FEEDS_VERIFIED=true"
          echo "MARKET_DATA_DOWNLOADER_USED=false"
      - name: Rebuild and confirm the frozen rank-1 candidate
        run: |
          python -m research.bidirectional_analogue_confirmation             --input-dir .data/empirical_feed             --discovery-report artifacts/discovery/bidirectional_discovery_report.json             --output artifacts/confirmation/bidirectional_confirmation_report.json             --sample-stride "${{ steps.binding.outputs.sample_stride }}"             --history-states "${{ steps.binding.outputs.history_states }}"             --parallel-workers 4
      - name: Bind immutable confirmation run identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/confirmation/bidirectional_confirmation_report.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          binding = result.get("orchestration_binding")
          if not isinstance(binding, dict):
              raise SystemExit("confirmation output has no orchestration binding")
          binding["confirmation_run_id"] = int("${{ github.run_id }}")
          binding["confirmation_head_sha"] = "${{ env.DISCOVERY_HEAD_SHA }}"
          path.write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - name: Verify confirmation boundary and promotion denial
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/confirmation/bidirectional_confirmation_report.json").read_text(encoding="utf-8"))
          assert result["state"] in {"PASS", "FAIL", "INCOMPLETE"}
          assert result["promotion_authorized"] is False
          assert result["live_execution_authorized"] is False
          assert result["confirmation_contract_version"] == "v1-bidirectional-analogue-confirmation"
          assert result["candidate"]["direction"] == "bidirectional"
          assert result["candidate"]["direction_policy"] == "pre_target_analogue_mean_argmax"
          assert result["candidate_fingerprint"] == result["candidate"]["candidate_fingerprint"]
          print("BIDIRECTIONAL_CONFIRMATION_VERIFIED=true")
          print("STATE=", result["state"])
          print("CONFIRMATION_N=", result.get("confirmation", {}).get("n"))
          print("PROMOTION_AUTHORIZED=false")
          print("LIVE_EXECUTION_AUTHORIZED=false")
          PY
      - name: Upload immutable confirmation evidence
        uses: actions/upload-artifact@v7
        with:
          name: BIDIRECTIONAL-ANALOGUE-CONFIRMATION-RESULT
          path: artifacts/confirmation/bidirectional_confirmation_report.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop unless confirmation actually passed
        run: |
          test "$(python -c 'import json; print(json.load(open("artifacts/confirmation/bidirectional_confirmation_report.json", encoding="utf-8"))["state"])')" = "PASS"
