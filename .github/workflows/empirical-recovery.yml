name: "01 — 🚑 RUN THIS — EMPIRICAL RECOVERY — LATEST"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/empirical-recovery.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Retained only for backwards-compatible dispatches; fresh recovery no longer depends on old artifacts"
        required: false
        default: ""
      retry_pairs:
        description: "Ignored by the self-contained recovery; all nine verified pairs are refreshed"
        required: false
        default: "EUR/USD,GBP/USD,USD/JPY,AUD/USD,USD/CAD,USD/CHF,NZD/USD,EUR/JPY,GBP/JPY"
      start:
        description: "UTC start timestamp"
        required: true
        default: "2020-01-01T00:00:00+00:00"
      end:
        description: "UTC end timestamp (blank = current UTC time)"
        required: false
        default: ""
      sample_stride:
        description: "Target stride in 10m bars"
        required: true
        default: "120"
      history_states:
        description: "Historical states used per target"
        required: true
        default: "10000"

permissions:
  contents: read
  actions: read

env:
  RECOVERY_START: ${{ inputs.start || '2020-01-01T00:00:00+00:00' }}
  RECOVERY_END: ${{ inputs.end || '' }}
  SAMPLE_STRIDE: ${{ inputs.sample_stride || '120' }}
  HISTORY_STATES: ${{ inputs.history_states || '10000' }}

jobs:
  validate:
    name: "Validate recovery research engine"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audited research branch
        uses: actions/checkout@v7
        with:
          ref: empirical-rest-v1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check .
          mypy trader_bot research
      - name: Run complete test suite
        run: pytest

  retry:
    name: "Refresh and verify all nine pair feeds"
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pair: "EUR/USD"
            slug: eurusd
          - pair: "GBP/USD"
            slug: gbpusd
          - pair: "USD/JPY"
            slug: usdjpy
          - pair: "AUD/USD"
            slug: audusd
          - pair: "USD/CAD"
            slug: usdcad
          - pair: "USD/CHF"
            slug: usdchf
          - pair: "NZD/USD"
            slug: nzdusd
          - pair: "EUR/JPY"
            slug: eurjpy
          - pair: "GBP/JPY"
            slug: gbpjpy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout audited research branch
        uses: actions/checkout@v7
        with:
          ref: empirical-rest-v1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned JETTA data client
        run: |
          go install github.com/Nosvemos/dukascopy-go/cmd/dukascopy-go@79a7354184f984fb006bc68f55681f8e7973aba5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Resolve UTC end time
        id: end
        env:
          INPUT_END: ${{ env.RECOVERY_END }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_END" ]; then value="$INPUT_END"; else value="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Download corrected real Dukascopy BID/ASK through JETTA
        run: |
          mkdir -p .data/empirical_feed
          python -m research.jetta_datafeed_download \
            --pair "${{ matrix.pair }}" \
            --start "${{ env.RECOVERY_START }}" \
            --end "${{ steps.end.outputs.value }}" \
            --out-dir .data/empirical_feed
      - name: Verify repaired pair output
        run: |
          set -euo pipefail
          test -s ".data/empirical_feed/${{ matrix.slug }}.jsonl"
          python - <<'PY'
          from pathlib import Path
          from research.datafeed_empirical import load_feed_bars
          path = Path('.data/empirical_feed') / '${{ matrix.slug }}.jsonl'
          rows = load_feed_bars(path)
          assert rows, f'No bars loaded from {path}'
          print(f'VALID_FEED=true pair={path.stem} bars={len(rows)}')
          PY
      - name: Upload verified pair artifact
        uses: actions/upload-artifact@v7
        with:
          name: empirical-recovery-${{ matrix.slug }}
          path: .data/empirical_feed/${{ matrix.slug }}.jsonl
          if-no-files-found: error
          retention-days: 90

  bundle:
    name: "Assemble retained nine-pair verified bundle"
    needs: [validate, retry]
    if: ${{ needs.validate.result == 'success' && needs.retry.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audited research branch
        uses: actions/checkout@v7
        with:
          ref: empirical-rest-v1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Create input directory
        run: mkdir -p .data/empirical_feed
      - name: Download all verified pair artifacts from this recovery run
        uses: actions/download-artifact@v8
        with:
          pattern: empirical-recovery-*
          path: .data/empirical_feed
          merge-multiple: true
      - name: Verify all nine retained pair files
        run: |
          set -euo pipefail
          for slug in audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy; do
            test -s ".data/empirical_feed/$slug.jsonl"
          done
          python - <<'PY'
          from pathlib import Path
          from research.datafeed_empirical import load_feed_bars
          for slug in 'audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy'.split():
              path = Path('.data/empirical_feed') / f'{slug}.jsonl'
              rows = load_feed_bars(path)
              assert rows
              print(f'RETAINED_FEED_VERIFIED=true pair={slug} bars={len(rows)}')
          PY
      - name: Upload retained verified nine-pair bundle
        uses: actions/upload-artifact@v7
        with:
          name: empirical-recovery-reused-artifacts
          path: .data/empirical_feed/*.jsonl
          if-no-files-found: error
          retention-days: 90

  analyze:
    name: "Run recovery empirical analysis"
    needs: [validate, bundle]
    if: ${{ needs.validate.result == 'success' && needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout audited research branch
        uses: actions/checkout@v7
        with:
          ref: empirical-rest-v1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Create input directory
        run: mkdir -p .data/empirical_feed
      - name: Download retained verified nine-pair bundle
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-reused-artifacts
          path: .data/empirical_feed
      - name: Verify all nine pair files before analysis
        run: |
          set -euo pipefail
          for slug in audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy; do
            test -s ".data/empirical_feed/$slug.jsonl"
          done
          python - <<'PY'
          from pathlib import Path
          from research.datafeed_empirical import load_feed_bars
          for slug in 'audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy'.split():
              path = Path('.data/empirical_feed') / f'{slug}.jsonl'
              rows = load_feed_bars(path)
              assert rows
              print(f'ANALYSIS_INPUT_VERIFIED=true pair={slug} bars={len(rows)}')
          PY
      - name: Run recovery empirical analysis
        run: |
          set -euo pipefail
          python -m research.enriched_conditional_experiment \
            --input-dir .data/empirical_feed \
            --output artifacts/recovery_empirical_report.json \
            --sample-stride "${SAMPLE_STRIDE}" \
            --history-states "${HISTORY_STATES}"
      - name: Upload VERIFIED recovery report
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-RECOVERY-EMPIRICAL-REPORT
          path: artifacts/recovery_empirical_report.json
          if-no-files-found: error
          retention-days: 90
