name: "24 — BIDIRECTIONAL ANALOGUE DISCOVERY — NON-LIVE"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/24-BIDIRECTIONAL-ANALOGUE-DISCOVERY.yml"
      - "research/bidirectional_analogue_discovery.py"
      - "research/similarity.py"
      - "research/enriched_conditional_experiment.py"
      - "research/statistics.py"
      - "tests/test_bidirectional_analogue_discovery.py"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed recovery run containing the nine verified pair artifacts"
        required: true
        default: "32874819018"
      sample_stride:
        description: "Target stride in 10m bars"
        required: true
        default: "60"
      history_states:
        description: "Historical states used per target"
        required: true
        default: "10000"

concurrency:
  group: bidirectional-analogue-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: \${{ inputs.source_run_id || '32874819018' }}
  SAMPLE_STRIDE: \${{ inputs.sample_stride || '60' }}
  HISTORY_STATES: \${{ inputs.history_states || '10000' }}

jobs:
  validate:
    name: "Validate bidirectional analogue discovery"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mainline
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Static checks
        run: |
          ruff check research/bidirectional_analogue_discovery.py research/similarity.py tests/test_bidirectional_analogue_discovery.py
          mypy research/bidirectional_analogue_discovery.py research/similarity.py

      - name: Discovery safety tests
        run: |
          pytest tests/test_bidirectional_analogue_discovery.py tests/test_research_pipeline.py -q

      - name: Assert non-live contract
        run: |
          grep -q '"live_execution_authorized": False' research/bidirectional_analogue_discovery.py
          grep -q '"promotion_authorized": False' research/bidirectional_analogue_discovery.py

  discover:
    name: "Run bidirectional nine-pair discovery"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout mainline
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Create input directory
        run: mkdir -p .data/empirical_feed artifacts

      - name: Download reused six-pair artifact bundle
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-reused-artifacts
          repository: \${{ github.repository }}
          run-id: \${{ env.SOURCE_RUN_ID }}
          github-token: \${{ github.token }}
          path: .data/empirical_feed

      - name: Download EUR/USD repaired artifact
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-eurusd
          repository: \${{ github.repository }}
          run-id: \${{ env.SOURCE_RUN_ID }}
          github-token: \${{ github.token }}
          path: /tmp/repaired/eurusd

      - name: Download GBP/USD repaired artifact
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-gbpusd
          repository: \${{ github.repository }}
          run-id: \${{ env.SOURCE_RUN_ID }}
          github-token: \${{ github.token }}
          path: /tmp/repaired/gbpusd

      - name: Download USD/JPY repaired artifact
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-usdjpy
          repository: \${{ github.repository }}
          run-id: \${{ env.SOURCE_RUN_ID }}
          github-token: \${{ github.token }}
          path: /tmp/repaired/usdjpy

      - name: Place repaired pair files
        run: |
          set -euo pipefail
          for slug in eurusd gbpusd usdjpy; do
            test -s "/tmp/repaired/$slug/$slug.jsonl"
            cp "/tmp/repaired/$slug/$slug.jsonl" ".data/empirical_feed/$slug.jsonl"
          done

      - name: Verify all nine pair files
        run: |
          set -euo pipefail
          for slug in audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy; do
            test -s ".data/empirical_feed/$slug.jsonl" || { echo "Missing $slug.jsonl"; exit 1; }
          done

      - name: Run bidirectional discovery
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m research.bidirectional_analogue_discovery \
            --input-dir .data/empirical_feed \
            --output artifacts/bidirectional_discovery_report.json \
            --sample-stride "$SAMPLE_STRIDE" \
            --history-states "$HISTORY_STATES" \
            --parallel-workers 4

      - name: Verify bidirectional discovery-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/bidirectional_discovery_report.json").read_text())
          assert report["status"] == "BIDIRECTIONAL_ANALOGUE_DISCOVERY_COMPLETED"
          assert report["selection_policy"]["contract_version"] == "v1-bidirectional-analogue-familywise"
          assert report["selection_policy"]["confirmation_used_for_selection"] is False
          assert report["selection_policy"]["prior_frozen_confirmation_artifact_read"] is False
          assert report["candidate_count"] >= 0
          assert report["global_split_cutoff"]
          assert len(report["source_manifest"]) == 9
          assert len(report["discovery_family"]) <= 12
          for candidate in report["top_candidates"]:
              assert "confirmation" not in candidate
              assert candidate["candidate_fingerprint"]
          print("BIDIRECTIONAL_DISCOVERY_VERIFIED=true")
          print("CANDIDATE_COUNT=", report["candidate_count"])
          print("FAMILY_SIZE=", len(report["discovery_family"]))
          print("RECORD_COUNT=", report["record_count"])
          PY

      - name: Bind discovery evidence to immutable orchestration inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/bidirectional_discovery_report.json")
          report = json.loads(path.read_text())
          report["orchestration_binding"] = {
              "discovery_head_sha": "\${{ github.sha }}",
              "discovery_run_id": int("\${{ github.run_id }}"),
              "source_run_id": int("\${{ env.SOURCE_RUN_ID }}"),
              "sample_stride": int("\${{ env.SAMPLE_STRIDE }}"),
              "history_states": int("\${{ env.HISTORY_STATES }}"),
          }
          path.write_text(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload bidirectional discovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: BIDIRECTIONAL-ANALOGUE-DISCOVERY-RESULT
          path: artifacts/bidirectional_discovery_report.json
          if-no-files-found: error
          retention-days: 30
