name: "31 — TIME-SERIES MOMENTUM/REVERSAL DISCOVERY — NON-LIVE"

on:
  pull_request:
    paths:
      - "research/time_series_momentum_discovery.py"
      - "tests/test_time_series_momentum_discovery.py"
      - ".github/workflows/31-TIME-SERIES-MOMENTUM-DISCOVERY.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "34139659497"
  SOURCE_ARTIFACT_NAME: "v5-prepared-nine-pair-feeds"

jobs:
  validate:
    name: Validate time-series momentum/reversal research
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -e ' .[dev]'
      - name: Static checks
        run: |
          ruff check research/time_series_momentum_discovery.py tests/test_time_series_momentum_discovery.py
          mypy research/time_series_momentum_discovery.py
      - name: Contract tests
        run: pytest -q tests/test_time_series_momentum_discovery.py
      - name: Assert non-live boundary
        run: |
          ! grep -q "place_order" research/time_series_momentum_discovery.py
          ! grep -q "promotion_authorized.*True" research/time_series_momentum_discovery.py

  discovery:
    name: Run 120-hypothesis time-series momentum/reversal discovery
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Prepare feed directory
        run: mkdir -p .data/empirical_feed artifacts
      - name: Download immutable verified nine-pair feed bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/source
      - name: Extract and verify feeds
        run: |
          set -euo pipefail
          tar -xzf /tmp/source/verified-nine-pair-feeds.tar.gz -C .
          for pair in eurusd gbpusd usdjpy audusd usdcad usdchf nzdusd eurjpy gbpjpy; do
            test -s ".data/empirical_feed/${pair}.jsonl"
          done
      - name: Run fixed research family
        run: |
          python -m research.time_series_momentum_discovery \
            --feed-dir .data/empirical_feed \
            --output artifacts/time_series_momentum_report.json
      - name: Verify report integrity and non-live policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/time_series_momentum_report.json").read_text(encoding="utf-8"))
          assert report["status"] == "TIME_SERIES_MOMENTUM_DISCOVERY_COMPLETED"
          assert report["family_size"] == 120
          assert report["selection_policy"]["whole_family_holm"] is True
          assert report["selection_policy"]["confirmation_used_for_selection"] is False
          assert report["promotion_authorized"] is False
          assert report["live_execution_authorized"] is False
          assert report["candidate_count"] >= 0
          print("TIME_SERIES_MOMENTUM_VERIFIED=true")
          print("CANDIDATE_COUNT=", report["candidate_count"])
          if report["confirmation"] is not None:
              print("CONFIRMATION_STATE=", report["confirmation"]["state"])
              print("CONFIRMATION_EXPECTANCY_PIPS=", report["confirmation"]["confirmation"]["expectancy_pips"])
              print("CONFIRMATION_PROFIT_FACTOR=", report["confirmation"]["confirmation"]["profit_factor"])
          PY
      - name: Upload immutable research evidence
        uses: actions/upload-artifact@v7
        with:
          name: TIME-SERIES-MOMENTUM-RESEARCH-EVIDENCE
          path: artifacts/time_series_momentum_report.json
          retention-days: 30