name: "27 — CURRENCY STRENGTH DISCOVERY — NON-LIVE"

on:
  push:
    branches: [research/currency-strength-v2-20260930]
    paths:
      - ".github/workflows/27-CURRENCY-STRENGTH-DISCOVERY.yml"
      - "research/currency_strength_discovery.py"
      - "tests/test_currency_strength_discovery.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/27-CURRENCY-STRENGTH-DISCOVERY.yml"
      - "research/currency_strength_discovery.py"
      - "tests/test_currency_strength_discovery.py"
      - "research/currency_strength_confirmation.py"
      - "tests/test_currency_strength_confirmation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: currency-strength-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: "34139659497"
  SOURCE_ARTIFACT_NAME: "v5-prepared-nine-pair-feeds"
  SAMPLE_STRIDE: "60"

jobs:
  validate:
    name: "Validate currency-strength discovery engine"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check research/currency_strength_discovery.py tests/test_currency_strength_discovery.py
          mypy research/currency_strength_discovery.py
      - name: Boundary tests
        run: pytest -q tests/test_currency_strength_discovery.py
      - name: Assert non-live contract
        run: |
          set -euo pipefail
          ! grep -q 'ExecutionGateway' research/currency_strength_discovery.py
          ! grep -q 'broker' research/currency_strength_discovery.py
          ! grep -q 'live_execution_enabled' research/currency_strength_discovery.py
          echo "CURRENCY_STRENGTH_NON_LIVE=true"

  discover:
    name: "Run complete 144-hypothesis currency-strength discovery"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Prepare directories
        run: mkdir -p .data/empirical_feed artifacts/discovery /tmp/repaired
      - name: Verify source recovery run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          repo = "${{ github.repository }}"
          run_id = os.environ["SOURCE_RUN_ID"]
          headers = {"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['GH_TOKEN']}","X-GitHub-Api-Version":"2022-11-28"}
          def get(url: str) -> dict:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run = get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
          assert run.get("conclusion") == "success"
          assert run.get("head_branch") == "main"
          artifacts = get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          matches = [a for a in artifacts if a.get("name") == os.environ["SOURCE_ARTIFACT_NAME"]]
          assert len(matches) == 1
          artifact = matches[0]
          assert not artifact.get("expired")
          assert datetime.fromisoformat(artifact["expires_at"].replace("Z","+00:00")) > datetime.now(timezone.utc)
          print("SOURCE_ARTIFACT_VERIFIED=true")
          print("SOURCE_RUN_ID=", run_id)
          print("SOURCE_ARTIFACT_NAME=", artifact["name"])
          PY
      - name: Download immutable verified nine-pair feed bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/source
      - name: Extract and verify feeds
        run: |
          set -euo pipefail
          tar -xzf /tmp/source/verified-nine-pair-feeds.tar.gz -C .
          for pair in eurusd gbpusd usdjpy audusd usdcad usdchf nzdusd eurjpy gbpjpy; do
            test -s ".data/empirical_feed/${pair}.jsonl"
          done
          echo "ALL_NINE_FEEDS_VERIFIED=true"
      - name: Run fixed currency-strength family
        run: |
          python -m research.currency_strength_discovery             --input-dir .data/empirical_feed             --sample-stride "${{ env.SAMPLE_STRIDE }}"             --output artifacts/discovery/currency_strength_discovery_report.json
      - name: Verify report integrity and immutable policy
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/discovery/currency_strength_discovery_report.json").read_text(encoding="utf-8")
          )
          assert report["status"] == "CURRENCY_STRENGTH_DISCOVERY_COMPLETED"
          assert report["contract_version"] == "v4-currency-strength-familywise-next-open-signal-horizon-leave-one-pair-out"
          assert report["discovery_family_size"] == 144
          assert report["sample_stride"] == 60
          assert report["selection_policy"]["entry_delay_bars"] == 1
          assert report["selection_policy"]["execution_model"].startswith("signal is computed at bar close t; entry occurs at next bar t+1 open")
          assert report["selection_policy"]["inference_unit"].startswith("per-timestamp cross-sectional mean outcome")
          assert report["selection_policy"]["signal_cross_section_policy"].startswith("strict leave-one-target-pair-out")
          assert len(report["family_results"]) == 144
          assert report["selection_policy"]["holms_scope"] == 144
          assert report["selection_policy"]["whole_family_holm"] is True
          assert report["selection_policy"]["confirmation_used_for_selection"] is False
          assert report["live_execution_authorized"] is False
          assert report["promotion_authorized"] is False
          assert len(report["source_manifest"]) == 9
          assert report["target_record_count"] > 0
          familywise_items = [
              item for item in report["family_results"] if item["passes_familywise"]
          ]
          assert report["candidate_count"] == len(familywise_items)
          fingerprints = set()
          for item in report["family_results"]:
              c = item["candidate"]
              canonical = {
                  "contract_version": report["contract_version"],
                  "lookback": int(c["lookback"]),
                  "horizon": int(c["horizon"]),
                  "mode": str(c["mode"]),
                  "orientation": str(c["orientation"]),
                  "threshold": float(c["threshold"]),
              }
              expected = hashlib.sha256(
                  json.dumps(
                      canonical,
                      sort_keys=True,
                      separators=(",", ":"),
                      ensure_ascii=True,
                  ).encode("utf-8")
              ).hexdigest()
              assert item["candidate_fingerprint"] == expected
              assert item["candidate"] == canonical | {"contract_version": report["contract_version"]}
              fingerprints.add(item["candidate_fingerprint"])
          assert len(fingerprints) == 144
          print("CURRENCY_STRENGTH_DISCOVERY_VERIFIED=true")
          print("DISCOVERY_FAMILY_SIZE=", report["discovery_family_size"])
          print("CANDIDATE_COUNT=", report["candidate_count"])
          print("TARGET_RECORD_COUNT=", report["target_record_count"])
          print("GLOBAL_SPLIT_CUTOFF=", report["global_split_cutoff"])
          print("PROMOTION_AUTHORIZED=false")
          print("LIVE_EXECUTION_AUTHORIZED=false")
          PY
      - name: Bind immutable orchestration inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/discovery/currency_strength_discovery_report.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["orchestration_binding"] = {
              "discovery_run_id": int("${{ github.run_id }}"),
              "discovery_head_sha": "${{ github.sha }}",
              "source_run_id": int("${{ env.SOURCE_RUN_ID }}"),
              "sample_stride": int("${{ env.SAMPLE_STRIDE }}"),
          }
          path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          PY
      - name: Upload immutable discovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: CURRENCY-STRENGTH-DISCOVERY-RESULT
          path: artifacts/discovery/currency_strength_discovery_report.json
          if-no-files-found: error
          retention-days: 30


      - name: Run frozen-candidate confirmation on untouched holdout
        run: |
          python -m research.currency_strength_confirmation \
            --input-dir .data/empirical_feed \
            --discovery-report artifacts/discovery/currency_strength_discovery_report.json \
            --output artifacts/confirmation/currency_strength_confirmation_report.json
      - name: Verify confirmation terminal state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(
              Path("artifacts/confirmation/currency_strength_confirmation_report.json").read_text(encoding="utf-8")
          )
          assert result["status"] == "CURRENCY_STRENGTH_CONFIRMATION_COMPLETED"
          assert result["promotion_authorized"] is False
          assert result["live_execution_authorized"] is False
          assert result["confirmation"]["state"] in {"PASS", "FAIL", "INCOMPLETE", "NO_DISCOVERY_CANDIDATE"}
          if result["confirmation"]["state"] == "NO_DISCOVERY_CANDIDATE":
              assert result["candidate"] is None
          else:
              assert result["candidate"]["rank"] == 1
              assert result["candidate_selection_rule"].startswith("rank-1 familywise discovery candidate was frozen before confirmation")
          print("CURRENCY_STRENGTH_CONFIRMATION_VERIFIED=true")
          print("STATE=", result["confirmation"]["state"])
          print("CONFIRMATION_N=", result["confirmation"]["n"])
          print("CONFIRMATION_EXPECTANCY_PIPS=", result["confirmation"]["expectancy_pips"])
          print("CONFIRMATION_PROFIT_FACTOR=", result["confirmation"]["profit_factor"])
          print("PROMOTION_AUTHORIZED=false")
          print("LIVE_EXECUTION_AUTHORIZED=false")
          PY
      - name: Upload immutable confirmation evidence
        uses: actions/upload-artifact@v7
        with:
          name: CURRENCY-STRENGTH-CONFIRMATION-RESULT
          path: artifacts/confirmation/currency_strength_confirmation_report.json
          if-no-files-found: error
          retention-days: 30
