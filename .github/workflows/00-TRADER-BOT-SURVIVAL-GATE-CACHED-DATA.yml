name: "🚨 00 — TRADER BOT SURVIVAL GATE — CACHED DATA"

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: "Research branch/commit to execute"
        required: true
        default: "research/enriched-conditional-experiment-v1"
      source_run_id:
        description: "Existing workflow run containing verified feed artifacts"
        required: true
        default: "32489667825"
      start:
        description: "UTC research start (used only for genuinely missing feeds)"
        required: true
        default: "2020-01-01T00:00:00+00:00"
      end:
        description: "UTC research end (used only for genuinely missing feeds)"
        required: false
        default: ""
      sample_stride:
        description: "Target stride in 10m bars"
        required: true
        default: "120"
      history_states:
        description: "Historical states per target"
        required: true
        default: "10000"
      pr_number:
        description: "PR to receive the run summary"
        required: true
        default: "26"

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: "1️⃣ Validate selected research ref"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.research_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check research trader_bot tests
          mypy research trader_bot
      - name: Test suite
        run: pytest

  feeds:
    name: "2️⃣ Reuse/download ${{ matrix.pair }} empirical BID/ASK"
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { pair: "EUR/USD", slug: "eurusd" }
          - { pair: "GBP/USD", slug: "gbpusd" }
          - { pair: "USD/JPY", slug: "usdjpy" }
          - { pair: "AUD/USD", slug: "audusd" }
          - { pair: "USD/CAD", slug: "usdcad" }
          - { pair: "USD/CHF", slug: "usdchf" }
          - { pair: "NZD/USD", slug: "nzdusd" }
          - { pair: "EUR/JPY", slug: "eurjpy" }
          - { pair: "GBP/JPY", slug: "gbpjpy" }
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.research_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Create feed directory
        run: mkdir -p .data/empirical_feed
      - name: Restore verified feed from previous run
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: survival-gate-feed-${{ matrix.slug }}
          path: .data/empirical_feed
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Check whether existing verified feed was restored
        id: cache_check
        shell: bash
        run: |
          if test -s ".data/empirical_feed/${{ matrix.slug }}.jsonl"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Reused existing verified artifact for ${{ matrix.pair }} from run ${{ inputs.source_run_id }}."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No reusable artifact found for ${{ matrix.pair }}; this pair must be downloaded."
          fi
      - name: Setup Go for fallback downloader
        if: steps.cache_check.outputs.present != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - name: Install pinned JETTA client for fallback
        if: steps.cache_check.outputs.present != 'true'
        run: |
          go install github.com/Nosvemos/dukascopy-go/cmd/dukascopy-go@79a7354184f984fb006bc68f55681f8e7973aba5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install runtime for fallback
        if: steps.cache_check.outputs.present != 'true'
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Download missing public Dukascopy BID/ASK data
        if: steps.cache_check.outputs.present != 'true'
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          END_ARG=""
          if [ -n "$END" ]; then END_ARG="--end $END"; fi
          python -m research.jetta_datafeed_download --pair "${{ matrix.pair }}" --start "$START" $END_ARG --out-dir .data/empirical_feed
      - name: Verify feed file
        run: test -s ".data/empirical_feed/${{ matrix.slug }}.jsonl"
      - uses: actions/upload-artifact@v7
        with:
          name: survival-gate-feed-${{ matrix.slug }}
          path: .data/empirical_feed/${{ matrix.slug }}.jsonl
          if-no-files-found: error
          retention-days: 30

  experiment:
    name: "3️⃣ Run enriched conditional experiment"
    needs: [validate, feeds]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.feeds.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.research_ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --upgrade pip && pip install -e .
      - uses: actions/download-artifact@v8
        with:
          pattern: survival-gate-feed-*
          path: .data/empirical_feed
          merge-multiple: true
      - name: Verify all nine feeds
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = ['eurusd','gbpusd','usdjpy','audusd','usdcad','usdchf','nzdusd','eurjpy','gbpjpy']
          root = Path('.data/empirical_feed')
          missing = [name for name in expected if not (root / f'{name}.jsonl').is_file()
          ]
          if missing:
              raise SystemExit('Missing feeds: ' + ', '.join(missing))
          print('All nine verified feed artifacts present. No unnecessary redownloads remain.')
          PY
      - name: Run enriched experiment
        env:
          STRIDE: ${{ inputs.sample_stride }}
          HISTORY: ${{ inputs.history_states }}
        run: |
          mkdir -p artifacts
          python -m research.enriched_conditional_experiment --input-dir .data/empirical_feed --sample-stride "$STRIDE" --history-states "$HISTORY" --output artifacts/enriched_conditional_experiment.json
      - name: Run confirmation robustness and cost stress audit
        run: |
          python -m research.conditional_robustness --input artifacts/enriched_conditional_experiment.json --output artifacts/conditional_robustness.json
      - name: Upload survival-gate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-TRADER-BOT-SURVIVAL-GATE
          path: |
            artifacts/enriched_conditional_experiment.json
            artifacts/conditional_robustness.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: "4️⃣ Post result to PR"
    needs: [validate, feeds, experiment]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Publish run summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VALIDATE: ${{ needs.validate.result }}
          FEEDS: ${{ needs.feeds.result }}
          EXPERIMENT: ${{ needs.experiment.result }}
          REF: ${{ inputs.research_ref }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          if [ "$VALIDATE" = "success" ] && [ "$FEEDS" = "success" ] && [ "$EXPERIMENT" = "success" ]; then
            STATUS="✅ Cached-data survival-gate completed successfully. Existing verified feeds were reused where available; only missing feeds were downloaded. This does NOT authorize live trading."
          else
            STATUS="❌ Cached-data survival-gate did not complete successfully. Validation=${VALIDATE}, feeds=${FEEDS}, experiment=${EXPERIMENT}. Live trading remains disabled."
          fi
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="### Trader Bot cached-data survival-gate run\n\nRef: \`$REF\`\nSource feed run: \`$SOURCE_RUN\`\n\n$STATUS\n\nWorkflow run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" || echo "PR summary could not be posted; workflow result remains authoritative."
