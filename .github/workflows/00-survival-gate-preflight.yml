name: "🧪 Survival Gate Preflight"

on:
  push:
    branches:
      - research/enriched-conditional-experiment-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed ref
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile all Python modules
        run: python -m compileall -q research trader_bot tests
      - name: Ruff
        run: ruff check research trader_bot tests
      - name: Mypy
        run: mypy research trader_bot
      - name: Pytest
        run: pytest -ra
