name: "🏁 FINAL EMPIRICAL RESEARCH — REUSE VERIFIED RESULT — NO REDOWNLOAD"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/FINAL-EMPIRICAL-RESEARCH.yml"

permissions:
  contents: read
  actions: read

env:
  ARTIFACT_API: "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100"
  VERIFIED_RUN_ID: "32481090602"

jobs:
  validate:
    name: "1️⃣ VALIDATE corrected analysis engine"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrected research branch
        uses: actions/checkout@v7
        with:
          ref: empirical-rest-v1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static validation
        run: |
          ruff check .
          mypy trader_bot research
      - name: Run complete test suite
        run: pytest

  reuse_verified:
    name: "2️⃣ REUSE VERIFIED FINAL EMPIRICAL RESEARCH — NO REDOWNLOAD — NO RECOMPUTE"
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Create artifact workspace
        run: mkdir -p artifacts
      - name: Restore previously completed verified final report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts_json="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$ARTIFACT_API")"
          artifact_id="$(printf '%s' "$artifacts_json" | jq -r --arg n "VERIFIED-EMPIRICAL-RESEARCH-REPORT-FINAL" --argjson rid "$VERIFIED_RUN_ID" '[.artifacts[] | select(.name==$n and .expired==false and .workflow_run.id==$rid)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "ERROR: previously completed VERIFIED-EMPIRICAL-RESEARCH-REPORT-FINAL artifact is unavailable." >&2
            exit 1
          fi
          echo "Reusing verified artifact $artifact_id from completed run $VERIFIED_RUN_ID."
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o /tmp/verified-final.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          unzip -oq /tmp/verified-final.zip -d artifacts
      - name: Verify reused final research result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/empirical_report.json')
          if not p.is_file():
              raise SystemExit('Missing restored empirical_report.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['research_status'] == 'EMPIRICAL_DATAFEED_RUN_COMPLETED'
          assert len(data['pairs']) == 9
          assert data['generated_at'].startswith('2026-08-21T')
          assert data['warning'].startswith('Research evidence only')
          print('VERIFIED_FINAL_EMPIRICAL_RESEARCH_REUSED=true')
          print('PAIR_COUNT=', len(data['pairs']))
          print('ORIGINAL_GENERATED_AT=', data['generated_at'])
          print('NO_MARKET_DATA_DOWNLOAD=true')
          print('NO_EMPIRICAL_RECOMPUTE=true')
      - name: Upload reuse verification marker
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-EMPIRICAL-RESEARCH-REUSED
          path: artifacts/empirical_report.json
          if-no-files-found: error
          retention-days: 30
