name: "🔬 Survival Gate — Dense Research Reuse"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/01-SURVIVAL-GATE-DENSE-RESEARCH.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: "1️⃣ Validate enriched research branch"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/enriched-conditional-experiment-v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: |
          ruff check research trader_bot tests
          mypy research trader_bot
          pytest

  dense:
    name: "2️⃣ Dense stride ${{ matrix.stride }} using existing nine feeds"
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        stride: [60, 30]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/enriched-conditional-experiment-v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Restore existing verified nine-pair feeds
        uses: actions/download-artifact@v8
        with:
          pattern: enriched-feed-*
          path: .data/empirical_feed
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 32595660595
      - name: Verify nine reused feed files
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = ['eurusd','gbpusd','usdjpy','audusd','usdcad','usdchf','nzdusd','eurjpy','gbpjpy']
          root = Path('.data/empirical_feed')
          missing = [x for x in expected if not (root / f'{x}.jsonl').is_file() or (root / f'{x}.jsonl').stat().st_size == 0]
          if missing:
              raise SystemExit('Missing reused feeds: ' + ', '.join(missing))
          print('All nine verified feeds restored from run 32595660595. No market-data download.')
          PY
      - name: Run enriched experiment
        env:
          STRIDE: ${{ matrix.stride }}
        run: |
          mkdir -p artifacts
          python -m research.enriched_conditional_experiment \
            --input-dir .data/empirical_feed \
            --sample-stride "$STRIDE" \
            --history-states 10000 \
            --output "artifacts/enriched_${STRIDE}.json"
      - name: Run robustness audit
        env:
          STRIDE: ${{ matrix.stride }}
        run: |
          python -m research.conditional_robustness \
            --input "artifacts/enriched_${STRIDE}.json" \
            --output "artifacts/robustness_${STRIDE}.json"
      - name: Cross-check and summarize promotion status
        env:
          STRIDE: ${{ matrix.stride }}
        run: |
          python - <<'PY'
          import json, os
          s=os.environ['STRIDE']
          e=json.load(open(f'artifacts/enriched_{s}.json',encoding='utf-8'))
          r=json.load(open(f'artifacts/robustness_{s}.json',encoding='utf-8'))
          assert e['status']=='ENRICHED_CONDITIONAL_EXPERIMENT_COMPLETED'
          assert r['status']=='CONDITIONAL_ROBUSTNESS_AUDIT_COMPLETED'
          eligible=[x for x in r['results'] if x.get('promotion_eligible')]
          print(f'STRIDE={s} RECORDS={e["record_count"]} FINALISTS={len(r["results"])} PROMOTION_ELIGIBLE={len(eligible)}')
          if eligible:
              for x in eligible:
                  print('ELIGIBLE',x['candidate'])
      - uses: actions/upload-artifact@v7
        with:
          name: DENSE-RESEARCH-${{ matrix.stride }}
          path: |
            artifacts/enriched_${{ matrix.stride }}.json
            artifacts/robustness_${{ matrix.stride }}.json
          if-no-files-found: error
          retention-days: 30
