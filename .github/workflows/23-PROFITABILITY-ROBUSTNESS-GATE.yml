name: "23 — FULL PROFITABILITY ROBUSTNESS — NON-LIVE"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/23-PROFITABILITY-ROBUSTNESS-GATE.yml"
      - "research/profitability_robustness.py"
      - "research/fresh_discovery_cycle.py"
      - "research/enriched_conditional_experiment.py"
      - "research/execution.py"

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "32874819018"
  SAMPLE_STRIDE: "60"
  HISTORY_STATES: "10000"

jobs:
  profitability:
    name: "Full non-live profitability and robustness test"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout mainline
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Static and unit validation
        run: |
          ruff check research/profitability_robustness.py research/fresh_discovery_cycle.py research/enriched_conditional_experiment.py research/execution.py
          mypy research/profitability_robustness.py research/fresh_discovery_cycle.py research/enriched_conditional_experiment.py research/execution.py
          pytest -q tests/test_fresh_discovery_cycle.py tests/test_fresh_candidate_confirmation.py
      - name: Prepare verified nine-pair inputs
        run: mkdir -p .data/empirical_feed artifacts /tmp/repaired
      - name: Download reused six-pair artifact bundle
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-reused-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: .data/empirical_feed
      - name: Download EUR/USD repaired artifact
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-eurusd
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/eurusd
      - name: Download GBP/USD repaired artifact
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-gbpusd
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/gbpusd
      - name: Download USD/JPY repaired artifact
        uses: actions/download-artifact@v8
        with:
          name: empirical-recovery-usdjpy
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/repaired/usdjpy
      - name: Place repaired pair files
        run: |
          set -euo pipefail
          for slug in eurusd gbpusd usdjpy; do
            test -s "/tmp/repaired/$slug/$slug.jsonl"
            cp "/tmp/repaired/$slug/$slug.jsonl" ".data/empirical_feed/$slug.jsonl"
          done
      - name: Verify nine pair inputs
        run: |
          set -euo pipefail
          for slug in audusd usdcad usdchf nzdusd eurjpy gbpjpy eurusd gbpusd usdjpy; do
            test -s ".data/empirical_feed/$slug.jsonl"
          done
          echo "NINE_PAIR_INPUTS_VERIFIED=true"
          echo "MARKET_DATA_DOWNLOADER_USED=false"
      - name: Run fresh discovery
        run: |
          python -m research.fresh_discovery_cycle \
            --input-dir .data/empirical_feed \
            --output artifacts/fresh_discovery_report.json \
            --sample-stride "$SAMPLE_STRIDE" \
            --history-states "$HISTORY_STATES"
      - name: Verify discovery boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('artifacts/fresh_discovery_report.json').read_text())
          assert report['status']=='FRESH_DISCOVERY_COMPLETED'
          assert report['selection_policy']['confirmation_used_for_selection'] is False
          assert report['selection_policy']['prior_frozen_confirmation_artifact_read'] is False
          assert report['top_candidates']
          print('DISCOVERY_BOUNDARY_VERIFIED=true')
          print('CANDIDATE_COUNT=',report['candidate_count'])
          print('RECORD_COUNT=',report['record_count'])
          PY
      - name: Run full profitability robustness test
        run: |
          python -m research.profitability_robustness \
            --input-dir .data/empirical_feed \
            --discovery-report artifacts/fresh_discovery_report.json \
            --output artifacts/profitability_robustness.json \
            --sample-stride "$SAMPLE_STRIDE" \
            --history-states "$HISTORY_STATES"
      - name: Verify non-live result and print metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/profitability_robustness.json').read_text())
          assert r['status']=='PROFITABILITY_ROBUSTNESS_COMPLETED'
          assert r['live_execution_authorized'] is False
          assert r['promotion_authorized'] is False
          print('PROFITABILITY_ROBUSTNESS_VERIFIED=true')
          print('RECOMMENDATION=',r['recommendation'])
          print('CONFIRMATION_EXPECTANCY_IMPROVEMENT_PIPS=',r['confirmation_expectancy_improvement_pips'])
          print('CHAMPION_STATE=',r['champion']['result']['state'])
          print('CHALLENGER_STATE=',r['challenger']['result']['state'])
          print('CHAMPION_CONFIRMATION=',r['champion']['result'].get('confirmation'))
          print('CHALLENGER_CONFIRMATION=',r['challenger']['result'].get('confirmation'))
          print('CHALLENGER_STRESS=',r['challenger']['result'].get('stress'))
          print('CHALLENGER_GATES=',r['challenger']['result'].get('gates'))
          print('LIVE_EXECUTION_AUTHORIZED=false')
          print('PROMOTION_AUTHORIZED=false')
          PY
      - name: Upload profitability evidence
        uses: actions/upload-artifact@v7
        with:
          name: FULL-PROFITABILITY-ROBUSTNESS-EVIDENCE
          path: artifacts/profitability_robustness.json
          if-no-files-found: error
          retention-days: 30
