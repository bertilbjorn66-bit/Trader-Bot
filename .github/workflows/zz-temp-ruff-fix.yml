name: Temporary Ruff Fix

on:
  push:
    branches: [intelligence-max-v2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'bertilbjorn66-bit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - run: ruff check . --fix
      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Apply Ruff auto-fixes'
          git push origin HEAD:intelligence-max-v2
