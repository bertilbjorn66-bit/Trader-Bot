name: CI

on:
  push:
    branches: [main, 'foundation/**', 'research/**', 'integration/**', 'multi-asset-*', 'multi-asset/**', 'intelligence-*', 'intelligence/**']
  pull_request:
    branches: [main, 'adaptive-ensemble-v1', 'multi-asset-foundation-v1', 'multi-asset-*', 'multi-asset/**', 'intelligence-*', 'intelligence/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Public boundary
        run: python research/public_boundary_check.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy trader_bot research

      - name: Pytest
        run: pytest
