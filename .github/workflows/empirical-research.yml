name: "🚀 EMPIRICAL RESEARCH — LATEST"

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start timestamp"
        required: true
        default: "2020-01-01T00:00:00+00:00"
      end:
        description: "UTC end timestamp (leave blank for current UTC time)"
        required: false
        default: ""
      pairs:
        description: "FX pairs to analyze"
        required: true
        default: "EUR/USD,GBP/USD,USD/JPY,AUD/USD,USD/CAD,USD/CHF,NZD/USD,EUR/JPY,GBP/JPY"
      sample_stride:
        description: "Target stride in 10-minute bars"
        required: true
        default: "120"
      history_states:
        description: "Historical states used per target"
        required: true
        default: "10000"

permissions:
  contents: read

jobs:
  empirical-research:
    name: "REAL MARKET DATA — 2020 to present"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout audited research branch
        uses: actions/checkout@v7
        with:
          ref: empirical-rest-v1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: Static checks
        run: |
          ruff check .
          mypy trader_bot research

      - name: Run complete test suite
        run: pytest

      - name: Download REAL Dukascopy BID/ASK historical data
        env:
          RESEARCH_START: ${{ inputs.start }}
          RESEARCH_END: ${{ inputs.end }}
          RESEARCH_PAIRS: ${{ inputs.pairs }}
        run: |
          END_ARG=""
          if [ -n "$RESEARCH_END" ]; then END_ARG="--end $RESEARCH_END"; fi
          python -m research.rest_datafeed_download \
            --start "$RESEARCH_START" \
            $END_ARG \
            --pairs "$RESEARCH_PAIRS" \
            --out-dir .data/empirical_feed

      - name: Run sequential empirical analysis
        env:
          RESEARCH_START: ${{ inputs.start }}
          RESEARCH_END: ${{ inputs.end }}
          RESEARCH_PAIRS: ${{ inputs.pairs }}
          RESEARCH_STRIDE: ${{ inputs.sample_stride }}
          RESEARCH_HISTORY: ${{ inputs.history_states }}
        run: |
          END_ARG=""
          if [ -n "$RESEARCH_END" ]; then END_ARG="--end $RESEARCH_END"; fi
          python -m research.datafeed_empirical \
            --start "$RESEARCH_START" \
            $END_ARG \
            --pairs "$RESEARCH_PAIRS" \
            --sample-stride "$RESEARCH_STRIDE" \
            --history-states "$RESEARCH_HISTORY" \
            --max-days-per-batch 7 \
            --input-dir .data/empirical_feed \
            --output artifacts/empirical_report.json

      - name: Upload VERIFIED empirical report
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-EMPIRICAL-RESEARCH-REPORT
          path: artifacts/empirical_report.json
          if-no-files-found: error
          retention-days: 30
